<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>English for Work Reports</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed brand band, then a single 56rem reading column.
   Order inside the column: skill tabs, cycle pills, level card with the A1-C2 scale,
   Overall, criteria table, Strengths, Points to Develop. Colors and the DM Sans face
   come from the teacher's existing report design. */
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --line: #e0e0e0;
  --track: #dcdfe3;
  --fg: #0a1128;
  --fg2: #3b4557;
  --muted: #667084;
  --band: #4e657b;
  --band-fg: #ffffff;
  --band-sub: #e8d3b0;
  --navy: #1c4562;
  --navy-fg: #ffffff;
  --accent: #1c4562;
  --bar: #1c4562;
  --tab: #e8e8e8;
  --gold: #cdad7d;
  --gold-fg: #0a1128;
  --chip: #e3edf5;
  --chip-fg: #1c4562;
  --good: #2d6a4f;
  --ok-bg: #e1f1e8;
  --ok-fg: #1f5a3e;
  --mid-bg: #f4ead7;
  --mid-fg: #6b4a14;
  --no-bg: #e8e8e8;
  --no-fg: #3b4557;
  --focus: #1c4562;
  --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151d;
    --card: #18212c;
    --line: #2a3646;
    --track: #2c3847;
    --fg: #eaeff5;
    --fg2: #b8c3d1;
    --muted: #8c99ab;
    --band: #33495c;
    --navy: #2d6a94;
    --accent: #8fc2e8;
    --bar: #62a6d4;
    --tab: #222e3c;
    --chip: #21364a;
    --chip-fg: #a9d1ee;
    --good: #7fc8a3;
    --ok-bg: #1f3a2e;
    --ok-fg: #8fd1ab;
    --mid-bg: #3a3020;
    --mid-fg: #e8c987;
    --no-bg: #2c3847;
    --no-fg: #b8c3d1;
    --focus: #8fc2e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151d;
  --card: #18212c;
  --line: #2a3646;
  --track: #2c3847;
  --fg: #eaeff5;
  --fg2: #b8c3d1;
  --muted: #8c99ab;
  --band: #33495c;
  --navy: #2d6a94;
  --accent: #8fc2e8;
  --bar: #62a6d4;
  --tab: #222e3c;
  --chip: #21364a;
  --chip-fg: #a9d1ee;
  --good: #7fc8a3;
  --ok-bg: #1f3a2e;
  --ok-fg: #8fd1ab;
  --mid-bg: #3a3020;
  --mid-fg: #e8c987;
  --no-bg: #2c3847;
  --no-fg: #b8c3d1;
  --focus: #8fc2e8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.wrap {
  max-width: 56rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Brand band */
.band { background: var(--band); color: var(--band-fg); padding-block: 1.75rem 1.5rem; text-align: center; }
.wordmark { font-size: 1.05rem; font-weight: 500; line-height: 1.25; letter-spacing: .01em; }
.wordmark span { color: var(--band-sub); }
.band h1 { font-size: 1.9rem; font-weight: 700; line-height: 1.15; margin-top: .6rem; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 1.5rem; margin-top: .75rem; font-size: .92rem; opacity: .93; }
.meta li { min-width: 0; }
.admin-link { display: inline-block; margin-top: .9rem; font-size: .82rem; color: var(--band-fg); opacity: .9; }
.admin-link[hidden] { display: none; }

main { padding-block: 1.5rem 3.5rem; }

/* Tabs and pills */
.tabs, .pills { display: flex; flex-wrap: wrap; gap: .5rem; }
.tabs { margin-bottom: 1.25rem; }
.pills { margin-bottom: 1rem; }
.tab, .pill {
  border: 0; cursor: pointer; border-radius: .5rem; background: var(--tab); color: var(--fg);
  font-weight: 500; transition: opacity .2s ease;
}
.tab { padding: .5rem 1rem; font-size: .92rem; }
.pill { padding: .35rem .8rem; font-size: .8rem; }
.tab:hover, .pill:hover { opacity: .88; }
.tab[aria-selected="true"] { background: var(--navy); color: var(--navy-fg); }
.pill[aria-pressed="true"] { background: var(--gold); color: var(--gold-fg); }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; }
.stack { display: grid; gap: 1.25rem; }

.lvl-wrap { border-top: 2px solid var(--gold); padding-top: 1.25rem; }
.lvl { padding: 1.25rem; }
.lvl-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem 1.5rem; flex-wrap: wrap; }
.lvl-cycle { font-size: 1.1rem; font-weight: 600; }
.lvl-val { text-align: right; }
.lvl-val b { display: block; font-size: 2.4rem; line-height: 1; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.lvl-val small { display: block; margin-top: .25rem; font-size: .75rem; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .3rem; margin-top: 1.1rem; }
.sc span { display: block; margin-top: .3rem; font-size: .7rem; text-align: center; color: var(--muted); }
.seg { height: .55rem; border-radius: .3rem; background: var(--track); overflow: hidden; }
.seg i { display: block; height: 100%; background: var(--bar); }

.how { margin-top: 1.1rem; padding-top: .8rem; border-top: 1px solid var(--line); }
.how > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: .5rem; font-size: .88rem; font-weight: 600; color: var(--accent); }
.how > summary::-webkit-details-marker { display: none; }
.how-b { display: grid; gap: .75rem; margin-top: .7rem; color: var(--fg2); font-size: .92rem; }
.why { padding: .7rem .9rem; border-left: 3px solid var(--gold); border-radius: .4rem; background: var(--chip); color: var(--fg); }
.why strong { display: block; margin-bottom: .15rem; }
.how-b .src { font-size: .78rem; color: var(--muted); }
.sample { margin-top: 1rem; padding: .7rem .9rem; border-left: 3px solid var(--mid-fg); border-radius: .4rem; background: var(--chip); color: var(--fg); font-size: .92rem; }
.sample strong { display: block; margin-bottom: .15rem; }
.sample p { color: var(--fg2); }
.overall { padding: 1.25rem; border-top: 2px solid var(--line); }
.card-h { display: flex; align-items: center; gap: .5rem; font-size: 1.1rem; font-weight: 600; }
.card-h svg { width: 1.25rem; height: 1.25rem; flex: none; stroke: var(--accent); }
.overall p { margin-top: .75rem; color: var(--fg2); white-space: pre-line; }
.overall .goal { margin-top: 1rem; padding: .8rem 1rem; border-left: 3px solid var(--gold); border-radius: .4rem; background: var(--chip); color: var(--fg); }
.overall .goal strong { display: block; margin-bottom: .15rem; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.overall .goal p { margin-top: 0; color: var(--fg); }
.goal-list { margin-top: .5rem; display: grid; gap: .25rem; }
.goal-list li { display: flex; gap: .5rem; align-items: baseline; }
.goal-list li::before { content: "→"; flex: none; font-weight: 700; color: var(--accent); }
.chk { margin-top: 1.1rem; }
.chk h3 { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chk ul { display: grid; gap: .8rem; margin-top: .6rem; }
.chk li { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: .25rem .9rem; align-items: start; }
.st { display: inline-block; justify-self: start; font-size: .75rem; font-weight: 600; padding: .1rem .6rem; border-radius: .4rem; white-space: nowrap; }
.st-ok { background: var(--ok-bg); color: var(--ok-fg); }
.st-mid { background: var(--mid-bg); color: var(--mid-fg); }
.st-no { background: var(--no-bg); color: var(--no-fg); }
.chk-b { min-width: 0; }
.chk-b p { margin-top: .15rem; font-size: .92rem; }

/* Criteria */
.crit { overflow: hidden; }
.crit-head, .crit-row {
  display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 6rem; gap: .5rem 1.25rem;
  padding: .85rem 1.25rem; align-items: start;
}
.crit-head { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-block: .7rem; }
.crit-row { border-top: 1px solid var(--line); }
.crit-n { font-weight: 600; font-size: .92rem; }
.crit-d { min-width: 0; color: var(--fg2); font-size: .92rem; line-height: 1.55; }
.eg { margin-top: .35rem; color: var(--fg); font-style: italic; overflow-wrap: anywhere; }
.crit-l { min-width: 0; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-fg); font-weight: 600; font-size: .85rem; padding: .15rem .65rem; border-radius: .4rem; font-variant-numeric: tabular-nums; }
.chip-note { display: block; margin-top: .25rem; font-size: .72rem; color: var(--muted); }
.nolevel { font-size: .8rem; color: var(--muted); }

/* Strengths and Points */
details.card > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: .6rem;
  padding: 1rem 1.25rem; font-size: 1.1rem; font-weight: 600;
}
details.card > summary::-webkit-details-marker { display: none; }
.chev { width: 1rem; height: 1rem; flex: none; stroke: var(--accent); transition: transform .2s ease; }
details[open] > summary .chev { transform: rotate(90deg); }
.topics { display: grid; gap: 1.4rem; padding: .25rem 1.25rem 1.4rem; }
.topic-t { display: flex; gap: .6rem; align-items: baseline; }
.topic-t > span:last-child { min-width: 0; }
.mk { flex: none; font-weight: 700; }
.mk.st { color: var(--good); }
.mk.pt { color: var(--accent); }
.tag { display: inline-block; margin-left: .35rem; padding: 0 .5rem; font-size: .72rem; font-weight: 600; border-radius: .35rem; background: var(--chip); color: var(--chip-fg); vertical-align: .05em; }
.ex { margin: .55rem 0 0 1.4rem; padding-left: .9rem; border-left: 2px solid var(--line); display: grid; gap: .4rem; }
.ex li { min-width: 0; color: var(--fg2); font-size: .92rem; overflow-wrap: anywhere; }
.cl { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.fix { color: var(--good); }

/* Older cycles keep a 0-5 score and free text blocks */
.bar { height: .6rem; margin-top: 1.1rem; border-radius: .35rem; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: .35rem; background: var(--bar); }
.lg { display: grid; gap: .9rem; padding: .25rem 1.25rem 1.4rem; }
.lg > p { color: var(--fg2); }
.lg .lg-top { display: flex; gap: .6rem; align-items: baseline; color: var(--fg); margin-top: .5rem; }
.lg .lg-top > span:last-child { min-width: 0; }
.lg-grp strong { display: block; }
.lg-grp .ex { margin-top: .4rem; }
.words { display: flex; flex-wrap: wrap; gap: .4rem; }
.words li { background: var(--chip); color: var(--chip-fg); font-size: .85rem; font-weight: 500; padding: .1rem .6rem; border-radius: .4rem; }

/* Messages and teacher index */
.note { padding: 1.75rem 1.25rem; text-align: center; color: var(--fg2); }
.note strong { display: block; color: var(--fg); font-size: 1.05rem; margin-bottom: .25rem; }
.idx-h { font-size: 1.3rem; font-weight: 700; }
.lead { margin-top: .4rem; color: var(--fg2); max-width: 42rem; }
.stu-list { display: grid; gap: .75rem; margin-top: 1.25rem; }
.stu { padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center; justify-content: space-between; }
.stu-main { min-width: 0; }
.stu-name { font-weight: 600; }
.stu-sub { font-size: .85rem; color: var(--muted); }
.stu-cycles { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
.stu-cycles a { font-size: .78rem; font-weight: 600; text-decoration: none; background: var(--gold); color: var(--gold-fg); padding: .1rem .6rem; border-radius: .4rem; }
.stu-code { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; min-width: 0; }
.stu-code code { font: 500 .85rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--chip); color: var(--chip-fg); padding: .2rem .55rem; border-radius: .35rem; overflow-wrap: anywhere; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: .5rem; padding: .3rem .75rem; font-size: .82rem; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

@media (max-width: 600px) {
  .band h1 { font-size: 1.6rem; }
  .crit-head { display: none; }
  .crit-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n l" "d d"; padding: .9rem 1rem; }
  .crit-n { grid-area: n; }
  .crit-l { grid-area: l; text-align: right; }
  .crit-d { grid-area: d; }
  .lvl, .overall { padding: 1rem; }
  .topics, .lg { padding-inline: 1rem; }
  .chk li { grid-template-columns: minmax(0, 1fr); }
  details.card > summary { padding-inline: 1rem; }
  .lvl-val { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .tab, .pill, .chev { transition: none; }
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <p class="wordmark">English for Work. <span>And Beyond.</span></p>
    <h1>Progress Report</h1>
    <ul class="meta" id="meta"></ul>
    <a class="admin-link" id="all-students" href="#" hidden>All students</a>
  </div>
</header>

<main class="wrap">
  <div id="msg" class="card note" role="status"><strong>Loading your report</strong>This takes a few seconds.</div>

  <div id="report" hidden>
    <div class="tabs" id="tabs" role="tablist" aria-label="Skills"></div>
    <div class="pills" id="pills" aria-label="Cycles"></div>
    <div class="stack" id="panel" role="tabpanel"></div>
  </div>

  <div id="index" hidden></div>
</main>

<script>
(function () {
  'use strict';
  var LV = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  var SK = [
    ['speaking', 'Speaking'],
    ['comprehension', 'Comprehension'],
    ['listening', 'Listening'],
    ['grammar', 'Grammar and Vocabulary'],
    ['writing', 'Writing']
  ];
  /* Cycle 5 and earlier call the same slot "Listening"; from Cycle 6 it is "Comprehension" */
  var SLOT = { comprehension: 'listening', listening: 'comprehension' };
  var S = { db: null, canEdit: false, mode: '', docs: [], skill: 'speaking', cycle: null, unsub: null, timer: null, ready: false };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- pieces ---------- */
  function quotes(q) {
    return q.map(function (x) {
      return '“' + esc(x.s) + '”' + (x.f ? ' <span class="fix">(“' + esc(x.f) + '”)</span>' : '');
    }).join('; ');
  }
  function exBody(e) {
    var lab = e.c ? '<span class="cl">' + esc(e.c) + ':</span> ' : '';
    var body = (e.q && e.q.length) ? quotes(e.q) : esc(e.t || '');
    return lab + body;
  }
  function parseLevel(l) {
    var m = /^(A1|A2|B1|B2|C1|C2)(\+)?$/.exec(l || '');
    return m ? { i: LV.indexOf(m[1]), h: !!m[2] } : null;
  }
  function scale(l) {
    var p = parseLevel(l);
    if (!p) return '';
    var o = '<div class="scale" role="img" aria-label="Level ' + esc(l) + ' on a scale from A1 to C2">';
    LV.forEach(function (n, i) {
      var w = i <= p.i ? '100%' : (p.h && i === p.i + 1 ? '50%' : '0%');
      o += '<div class="sc"><div class="seg"><i style="width:' + w + '"></i></div><span>' + n + '</span></div>';
    });
    return o + '</div>';
  }
  function chip(l, note) {
    if (!l) return '<span class="nolevel">No level yet</span>';
    return '<span class="chip">' + esc(l) + '</span>' + (note ? '<span class="chip-note">' + esc(note) + '</span>' : '');
  }
  function topic(t, kind) {
    var mk = kind === 'st' ? '<span class="mk st" aria-hidden="true">✔</span>' : '<span class="mk pt" aria-hidden="true">→</span>';
    var head = kind === 'st' ? esc(t.t) : '<strong>' + esc(t.t) + '</strong>' + (t.tip ? ' ' + esc(t.tip) : '');
    var tag = t.tag ? '<span class="tag">' + esc(t.tag) + '</span>' : '';
    var ex = (t.ex && t.ex.length) ? '<ul class="ex">' + t.ex.map(function (e) { return '<li>' + exBody(e) + '</li>'; }).join('') + '</ul>' : '';
    return '<li><p class="topic-t">' + mk + '<span>' + head + tag + '</span></p>' + ex + '</li>';
  }
  function fold(title, items, kind) {
    if (!items || !items.length) return '';
    var chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>';
    return '<details class="card" open><summary>' + chev + esc(title) + '</summary><ul class="topics">' +
      items.map(function (t) { return topic(t, kind); }).join('') + '</ul></details>';
  }
  function cycleLabel(d) { return 'Cycle ' + d.cycle + (d.range ? ' (' + d.range + ')' : ''); }

  /* short explanation of how a level is decided, plus the skill's own "why not the next level" (sk.why = {h, t}) */
  var HOW = 'The level is based on the CEFR, the European scale from A1 to C2. For each criterion in the table, what you said or wrote in class is compared with the CEFR description for that level. ' +
    'A skill reaches a level when most of its criteria reach it. A level reflects one cycle only, so it needs to be kept in the following cycle to stay. The amount of speech or text seen also matters: with little material, the level is less certain. A + level means a strong level: B1+ is strong B1 and B2+ is strong B2, with some criteria already at the next level but not most of them.';
  function how(sk) {
    var chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>';
    var why = (sk.why && sk.why.t) ? '<div class="why"><strong>' + esc(sk.why.h || 'Why this level') + '</strong><p>' + esc(sk.why.t) + '</p></div>' : '';
    return '<details class="how"><summary>' + chev + 'How your level is determined</summary><div class="how-b"><p>' + esc(HOW) + '</p>' + why +
      '<p class="src">Source: CEFR Companion Volume, chapter 5, Communicative language competences.</p></div></details>';
  }

  /* goals from earlier cycles (status: done, progress, no) and the goals that move to the next cycle */
  var ST = { done: ['Done', 'ok'], progress: ['Good progress', 'mid'], no: ['Not yet', 'no'] };
  function checkin(list) {
    if (!list || !list.length) return '';
    return '<div class="chk"><h3>Goals from earlier cycles</h3><ul>' + list.map(function (g) {
      var s = ST[g.st] || ST.no;
      return '<li><span class="st st-' + s[1] + '">' + s[0] + '</span><div class="chk-b"><strong>' + esc(g.g) + '</strong>' +
        (g.from ? '<span class="tag">' + esc(g.from) + '</span>' : '') + (g.note ? '<p>' + esc(g.note) + '</p>' : '') + '</div></li>';
    }).join('') + '</ul></div>';
  }
  /* visible note under the level when it rests on little material (sk.sample = {h, t}) */
  function sampleNote(sk) {
    if (!sk.sample || !sk.sample.t) return '';
    return '<div class="sample" role="note"><strong>' + esc(sk.sample.h || 'About this level') + '</strong><p>' + esc(sk.sample.t) + '</p></div>';
  }
  function goalBox(sk) {
    var items = (sk.goalItems && sk.goalItems.length) ? '<ul class="goal-list">' + sk.goalItems.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
    if (!sk.goal && !items) return '';
    return '<div class="goal"><strong>Goals for the next cycle</strong>' + (sk.goal ? '<p>' + esc(sk.goal) + '</p>' : '') + items + '</div>';
  }

  /* older cycles: a 0-5 score plus free text blocks (p, check, group, words) */
  function legacyLine(s) {
    var m = /^(\d{2}\/\d{2}(?: \(writing\))?):\s+([\s\S]*)$/.exec(String(s));
    return m ? '<span class="cl">' + esc(m[1]) + ':</span> ' + esc(m[2]) : esc(s);
  }
  function legacyBlock(b) {
    if (b.k === 'check') return '<p class="lg-top"><span class="mk st" aria-hidden="true">✔</span><span>' + esc(b.t) + '</span></p>';
    if (b.k === 'words') return '<ul class="words">' + (b.l || []).map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
    if (b.k === 'group') {
      return '<div class="lg-grp">' + (b.t ? '<strong>' + esc(b.t) + '</strong>' : '') +
        '<ul class="ex">' + (b.l || []).map(function (x) { return '<li>' + legacyLine(x) + '</li>'; }).join('') + '</ul></div>';
    }
    return '<p>' + esc(b.t) + '</p>';
  }
  function legacyFold(sec) {
    var chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>';
    return '<details class="card" open><summary>' + chev + esc(sec.title) + '</summary><div class="lg">' +
      (sec.blocks || []).map(legacyBlock).join('') + '</div></details>';
  }
  function legacyPanel(d, sk) {
    var n = Number(sk.score);
    var pct = Math.max(0, Math.min(100, n / 5 * 100));
    var h = '<section class="lvl-wrap"><div class="card lvl"><div class="lvl-top">' +
      '<span class="lvl-cycle">' + esc(cycleLabel(d)) + '</span>' +
      '<div class="lvl-val"><b>' + esc(n.toFixed(1)) + ' / 5.0</b><small>Score</small></div></div>' +
      '<div class="bar" role="img" aria-label="Score ' + esc(n.toFixed(1)) + ' out of 5"><i style="width:' + pct + '%"></i></div></div></section>';
    return h + (sk.sections || []).map(legacyFold).join('');
  }

  /* ---------- views ---------- */
  function show(which) {
    $('msg').hidden = which !== 'msg';
    $('report').hidden = which !== 'report';
    $('index').hidden = which !== 'index';
  }
  function message(title, text) {
    $('msg').innerHTML = '<strong>' + esc(title) + '</strong>' + esc(text || '');
    show('msg');
  }
  function sorted() { return S.docs.slice().sort(function (a, b) { return a.cycle - b.cycle; }); }
  function current() {
    var list = sorted();
    var d = list.filter(function (x) { return x.cycle === S.cycle; })[0] || list[list.length - 1];
    S.cycle = d ? d.cycle : null;
    return d;
  }

  function paintMeta(d) {
    var bits = [
      d.name ? 'Student: ' + d.name : '',
      d.courseLevel ? 'Level: ' + d.courseLevel : '',
      [d.period, 'Cycle ' + d.cycle].filter(Boolean).join(' · '),
      d.lastClass ? 'Last class: ' + d.lastClass : ''
    ].filter(Boolean);
    $('meta').innerHTML = bits.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
  }
  function skillsOf(d) {
    return SK.filter(function (s) { return d && d.skills && d.skills[s[0]]; });
  }
  /* keep the open tab valid when the cycle changes (Listening and Comprehension share a slot) */
  function fitSkill(d) {
    var have = (d && d.skills) || {};
    if (have[S.skill]) return;
    if (SLOT[S.skill] && have[SLOT[S.skill]]) { S.skill = SLOT[S.skill]; return; }
    var first = skillsOf(d)[0];
    if (first) S.skill = first[0];
  }
  function buildTabs(d) {
    $('tabs').innerHTML = skillsOf(d).map(function (s) {
      return '<button class="tab" role="tab" id="tab-' + s[0] + '" data-skill="' + s[0] + '" aria-controls="panel" aria-selected="' + (S.skill === s[0]) + '">' + esc(s[1]) + '</button>';
    }).join('');
  }
  function buildPills() {
    var list = sorted();
    $('pills').innerHTML = list.map(function (d) {
      return '<button class="pill" data-cycle="' + d.cycle + '" aria-pressed="' + (S.cycle === d.cycle) + '">' + esc(cycleLabel(d)) + '</button>';
    }).join('');
  }
  function syncSelection() {
    Array.prototype.forEach.call($('tabs').children, function (b) {
      var on = b.getAttribute('data-skill') === S.skill;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) $('panel').setAttribute('aria-labelledby', b.id);
    });
    Array.prototype.forEach.call($('pills').children, function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-cycle')) === S.cycle));
    });
  }
  function paintPanel() {
    var d = current();
    if (!d) return;
    paintMeta(d);
    var sk = (d.skills || {})[S.skill];
    if (!sk) {
      $('panel').innerHTML = '<div class="card note"><strong>Nothing here yet</strong>This skill has no report in ' + esc(cycleLabel(d)) + '.</div>';
      return;
    }
    if (typeof sk.score === 'number') {
      $('panel').innerHTML = legacyPanel(d, sk);
      return;
    }
    var h = '<section class="lvl-wrap"><div class="card lvl"><div class="lvl-top">' +
      '<span class="lvl-cycle">' + esc(cycleLabel(d)) + '</span>' +
      '<div class="lvl-val"><b>' + esc(sk.level || '-') + '</b><small>' + esc(sk.cap || 'CEFR level') + '</small></div></div>' +
      scale(sk.level) + sampleNote(sk) + how(sk) + '</div></section>';

    if (sk.overall || sk.goal || (sk.checkin && sk.checkin.length)) {
      h += '<section class="card overall"><h2 class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>Overall</h2>' + (sk.overall ? '<p>' + esc(sk.overall) + '</p>' : '') +
        checkin(sk.checkin) + goalBox(sk) + '</section>';
    }
    if (sk.criteria && sk.criteria.length) {
      h += '<section class="card crit" aria-label="Criteria"><div class="crit-head" aria-hidden="true"><span>Criterion</span><span>What was seen</span><span>Level</span></div><ul>' +
        sk.criteria.map(function (c) {
          var eg = exBody({ c: c.c, q: c.s ? [{ s: c.s, f: c.f }] : null, t: c.t });
          return '<li class="crit-row"><div class="crit-n">' + esc(c.n) + '</div><div class="crit-d">' + esc(c.d) +
            (eg ? '<div class="eg">' + eg + '</div>' : '') + '</div><div class="crit-l">' + chip(c.lv, c.note) + '</div></li>';
        }).join('') + '</ul></section>';
    }
    h += fold('Strengths', sk.strengths, 'st');
    h += fold('Points to Develop', sk.points, 'pt');
    $('panel').innerHTML = h;
  }

  function paintReport() {
    var d = current();
    if (!d) {
      message('No report found', 'Check the link your teacher sent you.');
      return;
    }
    fitSkill(d);
    buildTabs(d);
    buildPills();
    syncSelection();
    paintPanel();
    show('report');
  }

  /* ---------- data: one encrypted file per student ---------- */
  var ENC = new TextEncoder(), DEC = new TextDecoder(), ITER = 200000, SALT = 'english-for-work-reports-v1';
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function hex(u8) { return Array.prototype.map.call(u8, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  async function openReport(code) {
    var base = await crypto.subtle.importKey('raw', ENC.encode(code), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: ENC.encode(SALT), iterations: ITER, hash: 'SHA-256' }, base, 384));
    var res = await fetch('data/' + hex(bits.slice(32, 48)) + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('missing');
    var pk = await res.json();
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(pk.iv) }, key, unb64(pk.ct));
    return JSON.parse(DEC.decode(plain));
  }
  function route() {
    var code = (location.hash || '').replace(/^#/, '');
    $('all-students').hidden = true;
    S.docs = []; S.ready = false; S.cycle = null; S.mode = 'student';
    if (!/^[a-z0-9][a-z0-9-]{9,60}$/i.test(code)) {
      message('Open your personal link', 'Your teacher sent you a link that ends in your own code. Use that link to see your report.');
      return;
    }
    if (!(window.crypto && window.crypto.subtle)) {
      message('This browser cannot open the report', 'Try again in an up-to-date browser, using the https link.');
      return;
    }
    message('Loading your report', 'This takes a few seconds.');
    openReport(code).then(function (docs) {
      if (code !== (location.hash || '').replace(/^#/, '')) return;
      S.docs = docs.map(function (d) { return Object.assign({}, d, { _id: d.student + '_c' + d.cycle }); });
      S.ready = true;
      paintReport();
    }, function () {
      message('We could not open this report', 'Check that you opened the full link your teacher sent you. If it keeps happening, tell your teacher.');
    });
  }

  /* ---------- events ---------- */
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-skill]');
    if (!b) return;
    S.skill = b.getAttribute('data-skill');
    syncSelection();
    paintPanel();
  });
  $('pills').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cycle]');
    if (!b) return;
    S.cycle = Number(b.getAttribute('data-cycle'));
    var d = current();
    fitSkill(d);
    buildTabs(d);
    syncSelection();
    paintPanel();
  });
  window.addEventListener('hashchange', route);

  /* ---------- start ---------- */
  route();
})();
</script>
</body>
</html>
